<section id="certifications" class="py-24 bg-[#0D0D12] relative border-t border-[#1F1F2C]">
  <div class="w-full max-w-7xl mx-auto px-6 lg:px-12">
    <!-- Section Header -->
    <div class="text-center mb-16">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#1A1A24] border border-[#2A2A35] text-[#4F98A3] text-xs font-mono mb-4">
        <span>Continuous Learning</span>
      </div>
      <h2 class="text-4xl md:text-5xl font-bold text-white mb-4">Certifications</h2>
      <p class="text-[#797876] max-w-2xl mx-auto text-base">
        Verified industry credentials across cloud architectures, generative AI, APIs, and databases.
      </p>
    </div>

    <!-- Certifications Grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
      @for (cert of certifications; track cert.title) {
        <div class="p-6 rounded-xl bg-[#1A1A24] border border-[#2A2A35] hover:border-[#4F98A3] transition-all group flex flex-col justify-between">
          <div>
            <div class="flex items-start justify-between gap-4 mb-4">
              <div class="w-11 h-11 rounded-lg flex items-center justify-center shrink-0" [style.background]="cert.color + '20'">
                <lucide-icon [name]="Award" [size]="22" [style.color]="cert.color"></lucide-icon>
              </div>
              <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-[#0D0D12] text-[#A1A1AA] border border-[#2A2A35]">
                {{ cert.badgeCode }}
              </span>
            </div>

            <h3 class="text-base font-bold text-white mb-1 group-hover:text-[#4F98A3] transition-colors leading-snug">
              {{ cert.title }}
            </h3>
            <p class="text-xs text-[#797876] mb-4 font-mono">{{ cert.issuer }}</p>
          </div>

          <div class="pt-3 border-t border-[#2A2A35] flex items-center justify-between">
            <span class="inline-flex items-center gap-1.5 text-xs text-[#6DBF8F] font-mono">
              <lucide-icon [name]="CheckCircle" [size]="14"></lucide-icon>
              <span>Verified Credential</span>
            </span>
            @if (cert.credentialUrl) {
              <a [href]="cert.credentialUrl" target="_blank" rel="noopener noreferrer"
                class="text-xs text-[#4F98A3] hover:underline inline-flex items-center gap-1 font-mono">
                <span>View</span>
                <lucide-icon [name]="ExternalLink" [size]="12"></lucide-icon>
              </a>
            }
          </div>
        </div>
      }
    </div>

    <!-- LinkedIn CTA -->
    <div class="text-center">
      <button (click)="openLinkedIn()"
        class="inline-flex items-center gap-3 px-6 py-3 rounded-lg bg-[#13131A] border border-[#2A2A35] text-[#CDCCCA] hover:text-[#4F98A3] hover:border-[#4F98A3] text-sm font-semibold transition-all shadow-md">
        <lucide-icon [name]="Linkedin" [size]="18" class="text-[#4F98A3]"></lucide-icon>
        <span>View Full Verification Portfolio on LinkedIn</span>
        <lucide-icon [name]="ExternalLink" [size]="14"></lucide-icon>
      </button>
    </div>
  </div>
</section>
